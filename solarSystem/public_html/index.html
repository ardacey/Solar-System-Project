  <style>
    body, html {
      margin: 0; /* Remove default margins */
      padding: 0; /* Remove default padding */
      overflow: hidden; /* Prevent scrollbars */
    }

    canvas {
      display: block; /* Remove inline spacing from canvas */
      margin: 0; /* Remove canvas-specific margins */
      padding: 0; /* Remove canvas-specific padding */
      border: 0; /* Remove canvas border */
      width: 100vw; /* Ensure it spans the full viewport width */
      height: 100vh; /* Ensure it spans the full viewport height */
    }
  </style>

<div style="position: absolute; top: 10px; left: 10px;">

<canvas id="glCanvas" width="512" height="512" ></canvas>
